[project]
name = "runner-insights"
version = "0.1.0"
description = "Pipeline de coleta, tratamento e dashboard de corridas de rua de Fortaleza"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
